<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Display</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .filter-container { margin-bottom: 20px; }
        input, select { padding: 8px; margin-right: 10px; }
        .hotel-container { display: flex; flex-wrap: wrap; gap: 20px; }
        .hotel-card { border: 1px solid #ddd; padding: 10px; width: 300px; }
        img { width: 100%; height: 200px; object-fit: cover; }
        button { background-color: blue; color: white; padding: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Hotel Listings</h1>

    <!-- Filter Section -->
    <div class="filter-container">
        <input type="text" id="searchName" placeholder="Search by hotel name..." onkeyup="filterHotels()">
        <input type="text" id="searchLocation" placeholder="Search by location..." onkeyup="filterHotels()">
        <select id="serviceFilter" onchange="filterHotels()">
            <option value="">Filter by Service</option>
            <option value="WiFi">WiFi</option>
            <option value="Pool">Pool</option>
            <option value="Parking">Parking</option>
            <option value="Restaurant">Restaurant</option>
        </select>
        <select id="priceFilter" onchange="filterHotels()">
            <option value="">Filter by Price</option>
            <option value="low">Below $100</option>
            <option value="medium">$100 - $300</option>
            <option value="high">Above $300</option>
        </select>
        <label>
            <input type="checkbox" id="parkingFilter" onchange="filterHotels()"> Parking Available
        </label>
    </div>

    <!-- Hotel Listings -->
    <div class="hotel-container" id="hotel-list">
        <!-- Hotels will be dynamically added here -->
    </div>

    <script>
        let allHotels = [];

        // Function to fetch hotels from API
        async function fetchHotels() {
            try {
                const response = await fetch('https://api.example.com/hotels'); // Replace with actual API
                allHotels = await response.json();
                displayHotels(allHotels);
            } catch (error) {
                console.error('Error fetching hotels:', error);
            }
        }

        // Function to display hotels
        function displayHotels(hotels) {
            const hotelContainer = document.getElementById('hotel-list');
            hotelContainer.innerHTML = ''; // Clear existing content

            hotels.forEach(hotel => {
                const hotelCard = document.createElement('div');
                hotelCard.classList.add('hotel-card');
                hotelCard.innerHTML = `
                    <img src="${hotel.image}" alt="${hotel.name}">
                    <h3>${hotel.name}</h3>
                    <p><strong>Location:</strong> ${hotel.location}</p>
                    <p><strong>Price:</strong> $${hotel.price} per night</p>
                    <p><strong>Services:</strong> ${hotel.services.join(', ')}</p>
                    <p><strong>Parking:</strong> ${hotel.parking ? "Available" : "Not Available"}</p>
                    <button onclick="bookHotel('${hotel.id}')">Book Now</button>
                `;
                hotelContainer.appendChild(hotelCard);
            });
        }

        // Function to filter hotels
        function filterHotels() {
            const searchName = document.getElementById('searchName').value.toLowerCase();
            const searchLocation = document.getElementById('searchLocation').value.toLowerCase();
            const selectedService = document.getElementById('serviceFilter').value;
            const selectedPrice = document.getElementById('priceFilter').value;
            const parkingChecked = document.getElementById('parkingFilter').checked;

            const filteredHotels = allHotels.filter(hotel => {
                const matchesName = hotel.name.toLowerCase().includes(searchName);
                const matchesLocation = hotel.location.toLowerCase().includes(searchLocation);
                const matchesService = selectedService ? hotel.services.includes(selectedService) : true;
                const matchesParking = parkingChecked ? hotel.parking === true : true;

                let matchesPrice = true;
                if (selectedPrice === 'low') matchesPrice = hotel.price < 100;
                if (selectedPrice === 'medium') matchesPrice = hotel.price >= 100 && hotel.price <= 300;
                if (selectedPrice === 'high') matchesPrice = hotel.price > 300;

                return matchesName && matchesLocation && matchesService && matchesPrice && matchesParking;
            });

            displayHotels(filteredHotels);
        }

        // Function to book a hotel
        function bookHotel(hotelId) {
            window.location.href = `https://api.example.com/hotels/${hotelId}/book`; // Replace with actual booking URL
        }

        // Fetch hotels on page load
        fetchHotels();
    </script>

</body>
</html>
